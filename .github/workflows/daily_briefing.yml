name: Daily student activities

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Send student activities email
        env:
          GMAIL_USER: fashionbuy.org@gmail.com
          GMAIL_APP_PASSWORD: ${{ secrets.WEBSITESMTP1 }}
          MAIL_TO: wdtung@gmail.com
        run: python scripts/daily_penghu_email.py
